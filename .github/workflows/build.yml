# maple-v83-coop: builds dinput8.dll (Release|x86) on GitHub's Windows runners.
# Every push to main builds dinput8.dll and uploads it as an artifact. If RELEASE_TAG (repo root) names a tag
# that has no release yet, e.g. "coop-1", the build also publishes the DLL as that release on the built commit.
name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build Release x86
        run: msbuild "Ezorsia V2.sln" /p:Configuration=Release /p:Platform=x86 /m /v:minimal
      - name: Hash
        shell: pwsh
        run: |
          Get-ChildItem out\Release
          Get-FileHash -Algorithm SHA256 out\Release\dinput8.dll | Format-List
          (Get-FileHash -Algorithm SHA256 out\Release\dinput8.dll).Hash | Out-File -Encoding ascii out\Release\dinput8.dll.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: dinput8-${{ github.sha }}
          path: |
            out/Release/dinput8.dll
            out/Release/dinput8.dll.sha256
      - name: Publish release (RELEASE_TAG)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (-not (Test-Path RELEASE_TAG)) { "No RELEASE_TAG file; build only."; exit 0 }
          $tag = (Get-Content RELEASE_TAG -TotalCount 1).Trim()
          if (-not $tag) { "RELEASE_TAG is empty; build only."; exit 0 }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { "Release $tag already exists; build only."; exit 0 }
          gh release create $tag out/Release/dinput8.dll out/Release/dinput8.dll.sha256 --target "${{ github.sha }}" --title $tag --notes "Ezorsia v2 build for maple-v83-coop from ${{ github.sha }} (see COOP-CHANGES.md)."
