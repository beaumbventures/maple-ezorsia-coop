# maple-v83-coop: builds dinput8.dll (Release|x86) on GitHub's Windows runners.
# Every push uploads the DLL as a build artifact; pushing a tag like "coop-1" also publishes it as a release.
name: build
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build Release x86
        run: msbuild "Ezorsia V2.sln" /p:Configuration=Release /p:Platform=x86 /m /v:minimal
      - name: Hash
        shell: pwsh
        run: |
          Get-ChildItem out\Release
          Get-FileHash -Algorithm SHA256 out\Release\dinput8.dll | Format-List
          (Get-FileHash -Algorithm SHA256 out\Release\dinput8.dll).Hash | Out-File -Encoding ascii out\Release\dinput8.dll.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: dinput8-${{ github.sha }}
          path: |
            out/Release/dinput8.dll
            out/Release/dinput8.dll.sha256
      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" out/Release/dinput8.dll out/Release/dinput8.dll.sha256 --title "${{ github.ref_name }}" --notes "Ezorsia v2 build for maple-v83-coop (see COOP-CHANGES.md)."
