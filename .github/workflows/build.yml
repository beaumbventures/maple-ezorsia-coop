# maple-v83-coop: builds dinput8.dll (Release|x86) on GitHub's Windows runners.
# Every push uploads the DLL as a build artifact. Running it manually (workflow_dispatch) with a release_tag,
# e.g. "coop-1", also publishes the DLL as a GitHub release with that tag on the built commit.
name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish (e.g. coop-2); leave empty for a build only"
        required: false
        default: ""
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build Release x86
        run: msbuild "Ezorsia V2.sln" /p:Configuration=Release /p:Platform=x86 /m /v:minimal
      - name: Hash
        shell: pwsh
        run: |
          Get-ChildItem out\Release
          Get-FileHash -Algorithm SHA256 out\Release\dinput8.dll | Format-List
          (Get-FileHash -Algorithm SHA256 out\Release\dinput8.dll).Hash | Out-File -Encoding ascii out\Release\dinput8.dll.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: dinput8-${{ github.sha }}
          path: |
            out/Release/dinput8.dll
            out/Release/dinput8.dll.sha256
      - name: Publish release
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ inputs.release_tag }}" out/Release/dinput8.dll out/Release/dinput8.dll.sha256 --target "${{ github.sha }}" --title "${{ inputs.release_tag }}" --notes "Ezorsia v2 build for maple-v83-coop from ${{ github.sha }} (see COOP-CHANGES.md)."
